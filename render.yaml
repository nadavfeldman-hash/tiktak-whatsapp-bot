services:
  - type: web
    name: tiktak-whatsapp-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /var/data
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      # 360dialog hosts the WABA since the Coexistence onboarding (24 Aug 2026).
      # With this set, src/whatsapp.js sends via waba-v2.360dialog.io instead of Graph.
      - key: D360_API_KEY
        sync: false
      - key: D360_WABA_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: ADMIN_PHONE
        sync: false
      - key: ARBOX_API_KEY
        sync: false
      - key: ENABLE_CUSTOMER_AUTOMATIONS
        value: "false"
      - key: ADMIN_PANEL_PASSWORD
        sync: false
    disk:
      name: tiktak-data
      mountPath: /var/data
      sizeGB: 1
